<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brewery Finder</title>
    <link href="/src/style.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Alex+Brush&family=Lora:ital,wght@0,400..700;1,400..700&display=swap");
    </style>
  </head>

  <body class="bg-cream-bg min-h-screen">
    <h1
      class="bg-cream-bg mt-5 text-[96px] text-center"
      style="font-family: 'Alex Brush', cursive"
    >
      Library
    </h1>

    <h2 id="api-response" class="text-center mt-4 text-xl"></h2>

    <form id="search-form" class="flex flex-col items-center gap-4 mt-8">
      <input
        class="border-2 border-amber-900 p-3 rounded-lg w-full max-w-md"
        type="text"
        id="book-input"
        placeholder="Type a book title here..."
      />
      <button
        type="submit"
        class="bg-amber-800 text-white px-6 py-2 rounded-full hover:bg-amber-900 transition"
      >
        Search Books
      </button>
    </form>

    <div
      id="results-container"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-12 max-w-6xl mx-auto"
    ></div>

    <script src="src/main.js" type="module"></script>
  </body>
</html>
